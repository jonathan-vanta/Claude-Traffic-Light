[package]
name = "ctl-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
ctl-core = { path = "../crates/ctl-core" }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
